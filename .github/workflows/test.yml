name: test
# Installs every formula from source, runs its test block and brew audit, on macOS and Linux.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }

jobs:
  formula:
    name: brew install + test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: Homebrew/actions/setup-homebrew@main   # checks out this repo and links it as the tap
      - run: brew install --build-from-source antonbronnfjell/tap/html-design-system
      - run: brew test antonbronnfjell/tap/html-design-system
      - run: brew audit --strict --online antonbronnfjell/tap/html-design-system
      - run: ds --help
